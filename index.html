<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rutina Tomy</title>
<meta name="theme-color" content="#141b24">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png?v=3">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=3">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════ SISTEMA DE DISEÑO ═══════════ */
:root{
  --bg:#0a0e14;
  --card:#131a23;
  --card2:#19222e;
  --card3:#232d3b;
  --line:rgba(255,255,255,0.06);
  --line2:rgba(255,255,255,0.11);
  --border:var(--line);
  --border2:var(--line2);
  --gold:#f2b84b;
  --gold2:#ffd889;
  --gold-dim:rgba(242,184,75,0.13);
  --hot:#ff7a2f;
  --blue:#5cb8ff;
  --blue-dim:rgba(92,184,255,0.12);
  --green:#4cc38a;
  --green-dim:rgba(76,195,138,0.13);
  --text:#eef2f7;
  --muted:#8b97a8;
  --muted2:#5b6778;
  --shadow:0 14px 34px -16px rgba(0,0,0,0.75);
  --ink:#1a1206;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(90% 38% at 50% -6%,rgba(242,184,75,0.11),transparent 70%),
             radial-gradient(70% 30% at 110% 105%,rgba(92,184,255,0.06),transparent 70%)}
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── iconos ── */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ex-chk .ic,.p-chk .ic{width:13px;height:13px;stroke-width:2.8}
.s-badge .ic,.ph-pill .ic,.res-act-ok .ic{width:11px;height:11px;stroke-width:2.4}
.today-box-lbl .ic{width:12px;height:12px;stroke-width:2}
.chevron .ic,.p-chev .ic,.res-day-chev .ic{width:14px;height:14px;stroke-width:2.2}
.dbtn .ic,.tbtn .ic{width:14px;height:14px;stroke-width:2.2}
.week-nav-btn .ic{width:15px;height:15px;stroke-width:2.2}

/* ═══════════ HEADER ═══════════ */
.header{position:sticky;top:0;z-index:100;padding:12px 14px 10px;
  background:linear-gradient(180deg,rgba(10,14,20,0.97),rgba(10,14,20,0.88));
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line)}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.app-id{display:flex;align-items:center;gap:11px;min-width:0}
.app-logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;object-fit:cover;
  box-shadow:0 0 0 1px rgba(242,184,75,0.28),0 6px 18px -6px rgba(242,184,75,0.45)}
.app-title{display:flex;flex-direction:column;min-width:0}
.app-title-main{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:800;letter-spacing:0.2px;color:var(--text);line-height:1.05;white-space:nowrap}
.app-title-sub{font-size:11px;font-weight:500;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-date{font-size:11px;font-weight:600;color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;flex-shrink:0;text-transform:capitalize}

.week-strip-nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.week-strip-btn{width:30px;height:30px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;flex-shrink:0}
.week-strip-btn .ic{width:15px;height:15px;stroke-width:2.3}
.week-strip-btn:active{transform:scale(0.92);color:var(--gold)}
.week-strip-label{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--text)}
.week-strip-label span{font-size:9px;font-weight:700;color:var(--gold);background:var(--gold-dim);border-radius:999px;padding:3px 8px;margin-left:8px;letter-spacing:0.8px;text-transform:uppercase;vertical-align:1px}

/* tira de días con anillo de progreso */
.day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0 9px;border-radius:15px;cursor:pointer;transition:background 0.2s}
.day-btn .dn{font-size:10px;font-weight:700;color:var(--muted2);letter-spacing:0.4px}
.day-btn.today-mark .dn{color:var(--blue)}
.day-btn.today-mark::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.dring{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.dring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dring circle{fill:none;stroke-width:3;stroke-linecap:round}
.dr-bg{stroke:var(--card3)}
.dr-fg{stroke:var(--gold);transition:stroke-dashoffset 0.5s ease}
.day-btn.full-done .dr-fg{stroke:var(--green)}
.day-btn .dd{position:relative;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--text);line-height:1}
.day-btn.active{background:linear-gradient(180deg,rgba(242,184,75,0.15),rgba(242,184,75,0.03))}
.day-btn.active .dn{color:var(--gold)}
.day-btn.active .dring::before{content:'';position:absolute;inset:5px;border-radius:50%;background:linear-gradient(155deg,var(--gold2),var(--gold));box-shadow:0 4px 14px -3px rgba(242,184,75,0.65)}
.day-btn.active .dd{color:var(--ink)}

/* ═══════════ LAYOUT ═══════════ */
.content{padding:16px 14px 118px;position:relative}
.view{display:none}
.view.active{display:block;animation:fadeUp 0.3s ease both}

/* anillo de progreso grande */
.ring{width:80px;height:80px;position:relative;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .r-bg{stroke:rgba(255,255,255,0.07)}
.ring .r-fg{stroke:url(#ringGrad);transition:stroke-dashoffset 0.6s ease;filter:drop-shadow(0 0 5px rgba(242,184,75,0.35))}
.ring.done .r-fg{stroke:url(#ringGradG);filter:drop-shadow(0 0 5px rgba(76,195,138,0.4))}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--text);letter-spacing:-0.3px}
.ring-txt span{font-size:12px;font-weight:700;margin-left:1px;color:var(--muted)}
.ring.done .ring-txt{color:var(--green)}

/* botones */
.btn-pri{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 14px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--ink);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 10px 22px -10px rgba(242,184,75,0.8);transition:transform 0.15s}
.btn-pri .ic{width:17px;height:17px;stroke-width:2.2}
.btn-pri:active{transform:scale(0.97)}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 14px;border-radius:14px;border:1px solid var(--line2);
  background:rgba(255,255,255,0.04);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:transform 0.15s}
.btn-sec .ic{width:16px;height:16px;stroke-width:2;color:var(--blue)}
.btn-sec b{color:var(--blue);font-weight:700}
.btn-sec:active{transform:scale(0.97)}

/* control segmentado */
.seg{display:inline-flex;background:rgba(0,0,0,0.3);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg-b{border:none;background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;padding:7px 13px;border-radius:9px;cursor:pointer;transition:all 0.2s}
.seg-b.on{background:var(--card3);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.4)}

/* ═══════════ INICIO ═══════════ */
.hoy-card{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 16px;margin-bottom:10px;
  background:radial-gradient(110% 130% at 100% 0%,rgba(242,184,75,0.22),transparent 55%),linear-gradient(160deg,#1d2734,#111820);
  border:1px solid rgba(242,184,75,0.22);box-shadow:var(--shadow)}
.hoy-top{display:flex;align-items:center;gap:14px}
.hoy-inf{flex:1;min-width:0}
.hoy-ttl{font-family:'Barlow Condensed',sans-serif;font-size:29px;font-weight:800;line-height:1.02;margin-top:7px;color:var(--text)}
.hoy-sub{font-size:12px;color:var(--muted);margin-top:7px}
.hoy-cta{display:flex;gap:8px;margin-top:16px}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat-tile{background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:13px 12px 12px}
.stat-tile .v{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;line-height:1;color:var(--text)}
.stat-tile .v small{font-size:14px;color:var(--muted2);font-weight:700;margin-left:1px}
.stat-tile .k{font-size:10px;color:var(--muted);margin-top:6px;font-weight:600;line-height:1.3}

.body-card{border-radius:24px;padding:16px 10px 14px;box-shadow:var(--shadow);border:1px solid var(--line);
  background:radial-gradient(70% 55% at 50% 45%,rgba(242,184,75,0.07),transparent 72%),linear-gradient(170deg,#18212c,#0f151d)}
.body-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 6px 6px}
.body-ttl{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:800;margin-top:4px;line-height:1}
.body-wrap{display:flex;gap:0}
.body-col{flex:1;min-width:0;text-align:center}
.body-cap{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted2);margin-top:2px}
.body-svg{width:100%;height:auto;max-height:350px;display:block}
.body-svg .sil{fill:#1d2633}
.body-svg .m{stroke:#0b1016;stroke-width:1.3;stroke-linejoin:round;cursor:pointer;transition:opacity 0.15s}
.body-svg .m:active{opacity:0.75}
.body-svg .m.sel{stroke:#fff;stroke-width:2.1}
.body-svg .ln{fill:none;stroke:#0b1016;stroke-width:1.1;stroke-linecap:round;opacity:0.55;pointer-events:none}
.heat-scale{display:flex;align-items:center;gap:10px;margin-top:12px;padding:0 8px}
.heat-scale span{font-size:10px;font-weight:600;color:var(--muted2);white-space:nowrap}
.heat-bar{flex:1;height:6px;border-radius:999px;background:linear-gradient(90deg,#3b475c,#665334,#a36c22,#da9424,#eb5f1f);box-shadow:0 0 12px -2px rgba(242,140,40,0.35)}

.musc-det{margin-top:10px;border-radius:20px;padding:14px 16px;border:1px solid rgba(242,184,75,0.28);
  background:linear-gradient(160deg,rgba(242,184,75,0.10),rgba(242,184,75,0.02)),var(--card);animation:fadeUp 0.25s ease both}
.musc-det-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.musc-det-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 12px currentColor}
.musc-det-nm{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;flex:1;line-height:1}
.musc-det-v{font-size:12px;font-weight:700;color:var(--gold)}
.musc-det-x{background:rgba(255,255,255,0.05);border:1px solid var(--line);color:var(--muted);cursor:pointer;display:flex;padding:6px;border-radius:9px}
.musc-det-x .ic{width:13px;height:13px;stroke-width:2.2}
.musc-det-ls{display:flex;flex-wrap:wrap;gap:6px}
.musc-det-e{font-size:11px;font-weight:500;color:var(--text);background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.musc-det-vacio{font-size:11px;color:var(--muted2)}

.musc-rank{margin-top:10px;background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:14px 10px 8px}
.rank-ttl{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 8px}
.rank-ttl .eyebrow{color:var(--muted)}
.rank-u{font-size:10px;color:var(--muted2);font-weight:600}
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;cursor:pointer;transition:background 0.15s}
.rank-row:active,.rank-row.on{background:rgba(242,184,75,0.08)}
.rank-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rank-nm{font-size:12px;font-weight:600;color:var(--text);width:100px;flex-shrink:0}
.rank-bar{flex:1;height:7px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden}
.rank-fill{display:block;height:100%;border-radius:999px;transition:width 0.5s ease}
.rank-v{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--text);width:32px;text-align:right}
.rank-vacio{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12px;color:var(--muted);line-height:1.6;text-align:center;padding:20px 14px 16px}
.rank-vacio .ic{width:30px;height:30px;color:var(--muted2);stroke-width:1.5}
.rank-vacio b{color:var(--text)}

/* ═══════════ GYM ═══════════ */
.fase-box{background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:5px 5px 11px;margin-bottom:18px}
.fase-seg{display:flex;gap:3px;background:rgba(0,0,0,0.28);border-radius:15px;padding:3px;margin-bottom:11px}
.fase-pill{flex:1;padding:9px 4px;border-radius:12px;border:none;background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.5px;cursor:pointer;transition:all 0.2s}
.fase-pill.on{background:linear-gradient(155deg,var(--gold2),var(--gold));color:var(--ink);box-shadow:0 5px 14px -5px rgba(242,184,75,0.7)}
.fase-head{display:flex;align-items:center;gap:9px;cursor:pointer;padding:0 10px}
.fase-nm{font-size:13px;font-weight:700;color:var(--text)}
.fase-sub{font-size:11px;color:var(--muted);flex:1}
.fase-chev{color:var(--muted2);display:flex;transition:transform 0.3s}
.fase-chev .ic{width:14px;height:14px;stroke-width:2.2}
.fase-box.open .fase-chev{transform:rotate(180deg)}
.fase-txt{max-height:0;overflow:hidden;transition:max-height 0.35s ease;padding:0 10px}
.fase-box.open .fase-txt{max-height:400px}
.fase-txt p{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
.fase-txt p.fase-avance{color:var(--gold2);border-left:2px solid rgba(242,184,75,0.45);padding-left:10px}

.day-hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.day-hero-l{flex:1;min-width:0}
.day-lbl{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
.day-big{font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:900;letter-spacing:0.3px;line-height:0.95;margin-top:6px;
  background:linear-gradient(175deg,#fff,#a9b7c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.day-sub{font-size:12px;color:var(--muted);margin-top:8px}
.day-ring{flex-shrink:0}

.mode-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mode-btn{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line2);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:11px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.2s}
.mode-btn .ic{width:13px;height:13px;stroke-width:2.1}
.mode-btn.on{background:var(--gold-dim);border-color:rgba(242,184,75,0.45);color:var(--gold)}
.mode-hint{font-size:10px;color:var(--muted2);flex:1;text-align:right;line-height:1.4}

.session-card{background:linear-gradient(170deg,var(--card2),var(--card) 60%);border:1px solid var(--line);border-radius:22px;margin-bottom:10px;overflow:hidden;
  box-shadow:0 8px 22px -14px rgba(0,0,0,0.7);animation:fadeUp 0.3s ease both;transition:border-color 0.25s}
.session-card.open{border-color:var(--line2)}
.session-card.all-done{border-color:rgba(76,195,138,0.4);background:linear-gradient(170deg,rgba(76,195,138,0.08),var(--card) 60%)}
.sess-hdr{padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.s-ico{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06)}
.s-ico .ic{width:23px;height:23px}
.s-emoji{font-size:22px;line-height:1;display:inline-block}
.res-act-name .s-emoji{font-size:13px}
.ic-gym{background:linear-gradient(145deg,rgba(242,184,75,0.3),rgba(242,184,75,0.06));color:var(--gold2)}
.ic-run{background:linear-gradient(145deg,rgba(92,184,255,0.28),rgba(92,184,255,0.05));color:#acdcff}
.ic-arco{background:linear-gradient(145deg,rgba(76,195,138,0.28),rgba(76,195,138,0.05));color:#a2e8c4}
.s-inf{flex:1;min-width:0}
.s-type{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:3px}
.s-name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--text);line-height:1.08}
.s-badge{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--gold);background:var(--gold-dim);padding:5px 11px;border-radius:999px;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:4px}
.s-badge.ok{color:var(--green);background:var(--green-dim)}
.chevron{color:var(--muted2);transition:transform 0.3s;flex-shrink:0;display:flex}
.session-card.open .chevron{transform:rotate(180deg)}
.sess-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease}
.session-card.open .sess-body{max-height:4000px}
.pbar-wrap{padding:0 16px 10px}
.pbar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:600}
.pbar{height:5px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;transition:width 0.4s ease}
.pbar-fill.gfill{background:linear-gradient(90deg,var(--green),#8ef0bd)}

.ex-list{padding:0 14px 14px}
.ex-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--line);cursor:pointer;transition:opacity 0.2s}
.ex-item.done{opacity:0.5}
.ex-chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,0.02);color:transparent;transition:all 0.2s}
.ex-item.done .ex-chk{background:linear-gradient(145deg,var(--gold2),var(--gold));border-color:transparent;color:var(--ink);box-shadow:0 0 0 4px rgba(242,184,75,0.12)}
.ex-det{flex:1;min-width:0}
.ex-nm{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3}

// 0 = sin trabajar, 1..4 = cada vez más caliente
function nivelHeat(v){ if(!v || v <= 0) return 0; if(v < .25) return 1; if(v < .5) return 2; if(v < .8) return 3; return 4; }
const HEAT_SOLIDO = ['#3b475c','#9c8858','#e3ad50','#ffcf6e','#ff8a3a'];
function heatColor(v){ const n = nivelHeat(v); return n ? HEAT_SOLIDO[n] : null; }

function bodySVG(vista, heat, sel){
  let o = '<ellipse cx="120" cy="556" rx="58" ry="7" fill="#000" opacity=".4"/>';
  o += '<ellipse class="sil" cx="120" cy="38" rx="23" ry="29"/>';
  o += `<path class="sil" d="${_SIL}"/><path class="sil" ${_MIR} d="${_SIL}"/>`;
  for(const [id, piezas] of Object.entries(CUERPO[vista])){
    const n = nivelHeat(heat && heat[id]);
    const fill = n ? `url(#mH${n})` : 'url(#mIdle)';
    const glow = n >= 3 ? ' filter="url(#mGlow)"' : '';
    const cl = 'm' + (sel === id ? ' sel' : '');
    const tap = ` onclick="selMusc('${id}')"`;
    let g = '';
    piezas.forEach(d => { g += `<path class="${cl}"${tap} d="${d}"/><path class="${cl}"${tap} ${_MIR} d="${d}"/>`; });
    o += `<g fill="${fill}"${glow}>${g}</g>`;
  }
  CUERPO_LN[vista].forEach(d => { o += `<path class="ln" d="${d}"/><path class="ln" ${_MIR} d="${d}"/>`; });
  return `<svg viewBox="0 0 240 565" class="body-svg" role="img" aria-label="Mapa muscular, ${vista}">${o}</svg>`;
}

function musculosDe(nombre){
  for(const [re, m] of MUSC_REGLAS) if(re.test(nombre)) return m;
  return null;
}

// series de un ejercicio (si no las declara, cuenta como 1)
function seriesDe(ex){
  const n = parseInt(String(ex.sets||'').replace(/\D.*$/,''), 10);
  return n > 0 ? n : 1;
}

// Suma el volumen por músculo de los ejercicios HECHOS en un rango de días.
// Devuelve {vol:{musculo:series}, hechos:{musculo:[nombres]}, sinMapear:[...]}
function volumenMuscular(dias){
  const vol = {}, hechos = {}, sinMapear = [];
  let series = 0;
  const activos = new Set();
  const sumar = (nombre, series) => {
    const m = musculosDe(nombre);
    if(m === null){ if(!sinMapear.includes(nombre)) sinMapear.push(nombre); return; }
    for(const [k, w] of Object.entries(m)){
      vol[k] = (vol[k] || 0) + series * w;
      (hechos[k] = hechos[k] || []);
      if(!hechos[k].includes(nombre)) hechos[k].push(nombre);
    }
  };
  dias.forEach(dt => {
    const g = gymDe(dt);
    if(g) g.sessions.forEach(ses => ses.ex.forEach(ex => {
      if(store[gymKey(dt, ex.n)]){
        sumar(ex.n, seriesDe(ex));
        series += seriesDe(ex);
        activos.add(dateStr(dt));
      }
    }));
    const sk = postSessKey(dt.getDay());
    if(sk) POST[sk].phases.forEach(ph => ph.ex.forEach(ex => {
      if(store[postKey(dt, ex.id)]){ sumar(ex.name, 2); activos.add(dateStr(dt)); }
    }));
  });
  return {vol, hechos, sinMapear, series, dias: activos.size};
}

// Series por músculo para llegar al tope de la escala. Distinto por rango:
// una semana completa acumula mucho más volumen que un solo día.
const MUSC_OBJETIVO = {semana: 22, dia: 8};
function objetivoMusc(){ return MUSC_OBJETIVO[rangoCuerpo] || 22; }
function heatDe(vol){
  const h = {}, obj = objetivoMusc();
  for(const [k, v] of Object.entries(vol)) h[k] = Math.min(1, v / obj);
  return h;
}

// arma los 7 días de una fase
function buildFase(f){
  const F = FASES[f];
  const out = {0: null};
  Object.keys(F.dias).forEach(k => {
    const d = F.dias[k];
    out[k] = {
      label: d.label,
      tipo: 'Fuerza · ' + F.nombre,
      sessions: [
        { id:'cal'+k, type:'Entrada en calor · 8-10 min', name:'Core + movilidad',
          icon:'arch', ic:'ic-arco', ex: JSON.parse(JSON.stringify(CALENT[d.calent])) },
        { id:'fza'+k, type:'Fuerza · ' + F.rir, name:'Bloque principal',
          icon:'dumbbell', ic:'ic-gym', ex: JSON.parse(JSON.stringify(d.fuerza)) },
        { id:'core'+k, type:'Estabilidad y espinales', name:'Core',
          icon:'posture', ic:'ic-run', ex: JSON.parse(JSON.stringify(d.core)) }
      ]
    };
  });
  Object.keys(F.cardio).forEach(k => {
    const c = F.cardio[k];
    out[k] = {
      label: c.label,
      tipo: 'Running',
      sessions: [
        { id:'run'+k, type:'Running · ' + F.nombre, name:c.name,
          icon:'run', ic:'ic-run', ex: JSON.parse(JSON.stringify(c.ex)) }
      ]
    };
  });
  return out;
}

// ── CALENDARIO DE FASES ──
// El plan arranca el lunes 24/8/2026 y corre 19 semanas, hasta fin de año.
// Semanas 1–2 → Fase 1 · 3–6 → Fase 2 · 7 en adelante → Fase 3.
const PLAN_START = new Date(2026, 7, 24);
const PLAN_FIN   = new Date(2026, 11, 31);
const PLAN_SEMANAS = (function(){
  let n = 0, cur = new Date(PLAN_START);
  while(cur <= PLAN_FIN){ n++; cur.setDate(cur.getDate()+7); }
  return n;
})();

// número de semana del plan para una fecha (1 = semana de inicio)
function semanaDelPlan(dt){
  const mon = getMondayOf(dt);
  const ini = getMondayOf(PLAN_START);
  return Math.round((mon - ini) / 604800000) + 1;
}
function faseDeSemana(w){
  if(w <= 2) return 1;
  if(w <= 6) return 2;
  return 3;
}
function faseDeFecha(dt){ return faseDeSemana(semanaDelPlan(dt)); }
// primera semana de cada fase
const FASE_INICIO = {1:1, 2:3, 3:7};

// Cada fase tiene su propio objeto de 7 días, cacheado y mutable:
// lo que edita la persona vive acá y se persiste en localStorage.
let _faseCache = {};
function faseGym(f){
  if(!_faseCache[f]){
    const mine = readSaved()[f] || {};
    const o = {};
    for(let d=0; d<7; d++){
      o[d] = (mine[d] !== undefined) ? mine[d]
           : (FASE_DEFAULT[f][d] ? JSON.parse(JSON.stringify(FASE_DEFAULT[f][d])) : null);
    }
    _faseCache[f] = o;
  }
  return _faseCache[f];
}
// rutina del día que corresponde a ESA fecha, según la fase de su semana
function gymDe(dt){ return faseGym(faseDeFecha(dt))[dt.getDay()]; }

function dateStr(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const d2 = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${d2}`;
}

function getToday() { return new Date(); }

function getMondayOf(dt) {
  const d = new Date(dt);
  const dow = d.getDay();
  const diff = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function weekDays(mondayDt) {
  return Array.from({length:7}, (_,i) => {
    const d = new Date(mondayDt);
    d.setDate(mondayDt.getDate() + i);
    return d;
  });
}

function gymKey(dt, name) { return dateStr(dt) + '_gym_' + name; }
function postKey(dt, id) { return dateStr(dt) + '_post_' + id; }
function mobKey(dt) { return dateStr(dt) + '_mob'; }

let curDayDate = (function(){
  const t = getToday();
  t.setHours(0,0,0,0);
  return t;
})();
let resWeekOffset = 0;

function gymPct(dt) {
  const data = gymDe(dt);
  if(!data) return 0;
  const all = data.sessions.flatMap(s=>s.ex);
  return all.length ? Math.round(all.filter(e=>store[gymKey(dt,e.n)]).length/all.length*100) : 0;
}
function postPct(dt) {
  const d = dt.getDay();
  const sk = postSessKey(d);
  if(!sk) return 0;
  const all = POST[sk].phases.flatMap(p=>p.ex);
  return all.length ? Math.round(all.filter(e=>store[postKey(dt,e.id)]).length/all.length*100) : 0;
}
function mobDone(dt) { return !!store[mobKey(dt)]; }
function totalPct(dt) {
  const d = dt.getDay();
  const gp = gymPct(dt);
  const pp = postPct(dt);
  if(!gymDe(dt)) return pp;
  return Math.round((gp+pp)/2);
}

function buildDays() {
  const cont = document.getElementById('daySelector');
  cont.innerHTML = '';
  const today = getToday();
  today.setHours(0,0,0,0);
  const todayStr = dateStr(today);
  const weekStart = getMondayOf(curDayDate);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);

  const lbl = document.getElementById('weekStripLabel');
  if(lbl) {
    const fmt = d => d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    const isCurrentWeek = dateStr(getMondayOf(today)) === dateStr(weekStart);
    lbl.innerHTML = fmt(weekStart) + ' – ' + fmt(weekEnd) + (isCurrentWeek ? '<span>Esta semana</span>' : '');
  }

  for(let i=0; i<7; i++) {
    const dt = new Date(weekStart);
    dt.setDate(weekStart.getDate() + i);
    const tp = totalPct(dt);
    const isActive = dateStr(dt) === dateStr(curDayDate);
    const isToday = dateStr(dt) === todayStr;
    const btn = document.createElement('div');
    let cls = 'day-btn';
    if(isActive) cls += ' active';
    if(tp > 0 && tp < 100) cls += ' has-dot';
    if(tp >= 100) cls += ' full-done';
    if(isToday) cls += ' today-mark';
    btn.className = cls;
    btn.dataset.date = dateStr(dt);
    const C = 2 * Math.PI * 15.5, off = C * (1 - Math.min(tp,100)/100);
    btn.innerHTML = `<span class="dn">${'DLMXJVS'[dt.getDay()]}</span><span class="dring"><svg viewBox="0 0 36 36"><circle class="dr-bg" cx="18" cy="18" r="15.5"/><circle class="dr-fg" cx="18" cy="18" r="15.5" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><span class="dd">${dt.getDate()}</span></span>`;
    btn.onclick = () => selDay(dt);
    cont.appendChild(btn);
  }

  const hs = document.getElementById('hdrSub');
  if(hs){
    const w = semanaDelPlan(curDayDate);
    hs.textContent = (w >= 1 && w <= PLAN_SEMANAS)
      ? `Semana ${w} de ${PLAN_SEMANAS} · Fase ${faseDeFecha(curDayDate)}` : 'Movilidad · Fuerza';
  }
  const dr = document.getElementById('dayRing');
  if(dr) dr.innerHTML = ringSVG(totalPct(curDayDate), 74);
}

// escapa texto que escribe el usuario antes de insertarlo como HTML
function esc(t){
  return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// arma "4 x 10 reps - 20kg" omitiendo lo que este vacio
function exMeta(ex){
  if(ex.sets||ex.reps||ex.weight){
    const parts=[];
    if(ex.sets&&ex.reps) parts.push(ex.sets+' × '+ex.reps);
    else if(ex.sets) parts.push(ex.sets+' series');
    else if(ex.reps) parts.push(ex.reps);
    if(ex.weight) parts.push(ex.weight);
    return parts.join(' · ');
  }
  return ex.m||'';
}

function togSess(i){

function toggleGymAt(si, ei, dtStr) {
  const [y,m,d2] = dtStr.split('-').map(Number);
  const dt = new Date(y,m-1,d2);
  const data = gymDe(dt);
  const ex = data && data.sessions[si] && data.sessions[si].ex[ei];
  if(!ex) return;
  const k = gymKey(dt, ex.n);
  store[k] = !store[k];
  saveStore();
  renderSessions(dt, data);
  buildDays();
}

      card.style.animationDelay = (ei*0.04)+'s';
      const steps = ex.steps.map((s,i)=>`<li><span class="p-sn">${i+1}</span>${esc(s)}</li>`).join('');
      const safeN = ex.name.replace(/'/g,"\\'");
      const tb = ex.timer ? `<button class="tbtn" onclick="openTimer(${ex.timer},'${safeN}')">${icon('timer')} ${ex.timer}s</button>` : '';
      card.innerHTML = `<div class="p-hdr"><div class="p-chk" onclick="togglePost('${ex.id}','${dtStr}',event)">${ok?icon('check'):''}</div><div class="p-inf" onclick="togP('${ex.id}')"><div class="p-nm">${esc(ex.name)}${ex.banda?'<span class="p-banda">banda</span>':''}</div><div class="p-pm">${esc(ex.params)}</div></div><span class="p-chev" onclick="togP('${ex.id}')">${icon('chevron')}</span></div><div class="p-body"><div class="p-detail">${ex.why?`<div class="p-why"><strong>¿Por qué?</strong> ${esc(ex.why)}</div>`:''}<ul class="p-steps">${steps}</ul><div class="p-btns">${tb}<button class="dbtn${ok?' is-done':''}" onclick="togglePost('${ex.id}','${dtStr}',event)">${ok?icon('check')+' Hecho':'Marcar hecho'}</button></div></div></div>`;
      cont.appendChild(card);
    });
  });
  if(sess.notas && sess.notas.length){
    const nt = document.createElement('div');
    nt.className = 'post-notas';

      + sess.notas.map(t=>`<div class="nota"><span class="nota-dot"></span><span>${esc(t)}</span></div>`).join('');
    cont.appendChild(nt);
  }
}

function togP(id){

}

function togglePost(id, dtStr, ev) {
  if(ev) ev.stopPropagation();

function renderResumen() {
  const cont = document.getElementById('resContent');
  cont.innerHTML = '';

  const today = getToday();
  today.setHours(0,0,0,0);
  const todayStr = dateStr(today);

  const baseMon = getMondayOf(today);
  const weekMon = new Date(baseMon);
  weekMon.setDate(baseMon.getDate() + resWeekOffset * 7);
  const days = weekDays(weekMon);
  const weekSun = days[6];

  const fmt = (dt) => dt.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  const weekRange = `${fmt(weekMon)} – ${fmt(weekSun)}`;
  const isCurrentWeek = resWeekOffset === 0;

  cont.innerHTML = `<div class="res-header"><div class="res-title">RESUMEN SEMANAL</div><div class="res-sub">Vista general · progreso y actividades</div></div>`;

  const sd = curDayDate;
  const sdStr = dateStr(sd);
  const gp = gymPct(sd), mok = mobDone(sd), pp = postPct(sd), tp = totalPct(sd);
  const tb = document.createElement('div');
  tb.className = 'today-box';
  const isRestDay = !gymDe(sd) && !postSessKey(sd.getDay());
  const dayLabel = sdStr === todayStr ? 'HOY · ' : '';
  const hdr = `<div class="today-box-lbl">${icon('calendar')} ${dayLabel}${DN[sd.getDay()]}</div>`;

  if(isRestDay) {
    tb.innerHTML = hdr + `<div class="rest-row"><div class="rest-ic">${icon('moon')}</div><div><div class="rest-inf-t">Día de descanso</div><div class="rest-inf-s">Recuperación activa · hidratate bien</div></div></div>`;
  } else {
    const C = 2 * Math.PI * 34;                  // circunferencia del anillo
    const off = C * (1 - Math.min(tp,100)/100);
    const hasGym = !!gymDe(sd);
    const hasMob = !!postSessKey(sd.getDay());
    const bar = (nm, ico, val, cls, show) => show
      ? `<div><div class="stat-top"><span class="stat-nm">${icon(ico)} ${nm}</span><span class="stat-val">${val}%</span></div><div class="stat-bar"><div class="stat-fill ${val>=100?'full':cls}" style="width:${val}%"></div></div></div>`
      : `<div><div class="stat-top"><span class="stat-nm">${icon(ico)} ${nm}</span><span class="stat-val" style="color:var(--muted2);font-size:11px">—</span></div><div class="stat-bar"></div></div>`;
    tb.innerHTML = hdr + `<div class="today-row">
      <div class="ring${tp>=100?' done':''}">
        <svg viewBox="0 0 80 80"><circle class="r-bg" cx="40" cy="40" r="34"/><circle class="r-fg" cx="40" cy="40" r="34" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
        <div class="ring-txt">${tp}<span>%</span></div>
      </div>
      <div class="today-stats">
        ${bar('Gym','dumbbell',gp,'fill-gym',hasGym)}
        ${bar('Movilidad','posture',pp,'fill-mob',hasMob)}
      </div>
    </div>`;
  }
  cont.appendChild(tb);

  const nav = document.createElement('div');
  nav.className = 'week-nav';
  nav.innerHTML = `
    <button class="week-nav-btn" onclick="changeWeek(-1)">${icon('arrowL')}</button>
    <div class="week-nav-center">
      <div class="week-nav-label">${weekRange}</div>
      <div class="week-nav-sub">${(() => {
        const w = semanaDelPlan(weekMon);
        if(w < 1 || w > PLAN_SEMANAS) return 'Fuera del plan';
        return `Semana ${w} · Fase ${faseDeSemana(w)} — ${FASES[faseDeSemana(w)].nombre}`;
      })()}</div>
      ${!isCurrentWeek ? `<div><span class="week-nav-today" onclick="changeWeek(0)">IR A HOY</span></div>` : '<div style="font-size:9px;color:var(--gold);margin-top:3px;font-weight:700">SEMANA ACTUAL</div>'}
    </div>
    <button class="week-nav-btn" onclick="changeWeek(1)">${icon('arrowR')}</button>
  `;
  cont.appendChild(nav);

  const wl = document.createElement('div');
  wl.className = 'week-label';
  wl.textContent = 'ACTIVIDADES POR DÍA';
  cont.appendChild(wl);

  days.forEach((dt, i) => {
    const d = dt.getDay();
    const dtStr2 = dateStr(dt);
    const isFuture = dt > today;
    const isToday2 = dtStr2 === todayStr;
    const isCurDay = dtStr2 === sdStr;
    const data = gymDe(dt);
    const tp2 = isFuture ? 0 : totalPct(dt);
    const sk = postSessKey(d);
    const pctColor = tp2>=100?'var(--green)':tp2>0?'var(--gold)':'var(--muted)';

    let acts = [];
    if(sk) acts.push({type:'mob',name:`${icon('posture')} ${POST[sk].title}`,done:!isFuture&&mobDone(dt)});
    if(data) {
      data.sessions.forEach(sess => {
        const dn = isFuture ? 0 : sess.ex.filter(e=>store[gymKey(dt,e.n)]).length;
        acts.push({type:sess.ic==='ic-run'?'run':'gym',name:`${sessGlyph(sess)} ${esc(sess.name)}${isFuture?'':' ('+dn+'/'+sess.ex.length+')'}`,done:!isFuture&&dn===sess.ex.length});
      });
    } else {
      acts.push({type:'rest',name:icon('moon')+' Descanso total',done:true});
    }

    const actsHTML = acts.map(a=>`<div class="res-act"><div class="res-act-dot dot-${a.type}"></div><div class="res-act-name">${a.name}</div><div class="${a.done?'res-act-ok':'res-act-pend'}">${isFuture&&a.type!=='rest'?'—':a.done?icon('check')+' hecho':'pendiente'}</div></div>`).join('');

    const card = document.createElement('div');
    let cardCls = 'res-day-card';
    if(isCurDay) cardCls += ' r-open';
    if(isToday2) cardCls += ' is-today-card';
    card.className = cardCls;
    card.id = 'rdd'+i;

    const todayBadge = isToday2 ? ' · <span style="color:var(--blue);font-size:9px;font-weight:700">HOY</span>' : '';
    card.innerHTML = `<div class="res-day-hdr" onclick="togR('rdd${i}')">
      <div class="res-day-num${isToday2?' is-today':''}">${dt.getDate()}</div>
      <div class="res-day-info">
        <div class="res-day-name">${DS[d]}${todayBadge}</div>
        <div class="res-day-sub">${data?data.label:'Descanso'}${isFuture?' · <span style="color:var(--muted2);font-size:9px">pendiente</span>':''}</div>
      </div>
      <div class="res-day-pct" style="color:${isFuture?'var(--muted2)':pctColor}">${isFuture?'—':tp2>0?tp2+'%':data?'—':icon('moon')}</div>
      <span class="res-day-chev">${icon('chevron')}</span>
    </div>
    <div class="res-day-body"><div class="res-act-list">${actsHTML}</div></div>`;
    cont.appendChild(card);
  });
}

    resWeekOffset = 0;
  } else {

  }

}

let timerInterval=null,timerSecs=0,timerTotal=0,timerRunning=false;

  document.getElementById('tDisp').textContent=fmt(s);

}
function updateRing(rem,total){
  const c=document.getElementById('tCircle');
  const circ=2*Math.PI*87;
  c.style.strokeDasharray=circ;
  c.style.strokeDashoffset=total>0?circ*(1-rem/total):0;

function toggleTimer(){
  if(timerRunning){clearInterval(timerInterval);timerRunning=false;document.getElementById('tToggle').textContent='CONTINUAR';}
  else{timerRunning=true;document.getElementById('tToggle').textContent='PAUSAR';
    timerInterval=setInterval(()=>{timerSecs--;updateRing(Math.max(0,timerSecs),timerTotal);document.getElementById('tDisp').textContent=timerSecs>0?fmt(timerSecs):'¡LISTO!';if(timerSecs<=0){clearInterval(timerInterval);timerRunning=false;document.getElementById('tToggle').textContent='REINICIAR';}},1000);}
}
function closeTimer(){clearInterval(timerInterval);timerRunning=false;document.getElementById('timerOv').classList.remove('show')}
function fmt(s){const m=Math.floor(s/60);const sec=s%60;return m+':'+(sec<10?'0':'')+sec}

// anillo de progreso (r=34 sobre 80x80); el trazo usa #ringGrad / #ringGradG
function ringSVG(pct, size){
  const p = Math.max(0, Math.min(100, pct || 0));
  const C = 2 * Math.PI * 34, off = C * (1 - p/100);
  const st = size ? ` style="width:${size}px;height:${size}px"` : '';
  return `<div class="ring${p>=100?' done':''}"${st}><svg viewBox="0 0 80 80"><circle class="r-bg" cx="40" cy="40" r="34"/><circle class="r-fg" cx="40" cy="40" r="34" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="ring-txt">${p}<span>%</span></div></div>`;
}

// ── RUTINA EDITABLE ──
// Se guarda la rutina completa por dia de semana. Al editar cualquier cosa
// de un dia, ese dia queda "propio" del usuario y ya no toma el default.
// Cada fase guarda su propia copia editable de los 7 días.
const ROUTINE_KEY = 'rc_routine_v3';

// Cada siembra descarta lo guardado de esos días en las tres fases, para
// que vuelvan a tomar el default nuevo. Corre una sola vez por clave.
const SEEDS = [
  {key:'rc_seed_pushpull_v1', dias:[1,3]},
  {key:'rc_seed_superior_v1', dias:[5]}
];
function seedRutinas(){
  try {
    SEEDS.forEach(sd => {
      if(localStorage.getItem(sd.key)) return;
      const saved = JSON.parse(localStorage.getItem(ROUTINE_KEY) || '{}');
      let toco = false;
      Object.keys(saved).forEach(f => {
        sd.dias.forEach(d => {
          if(saved[f] && saved[f][d] !== undefined){ delete saved[f][d]; toco = true; }
        });
      });
      if(toco) localStorage.setItem(ROUTINE_KEY, JSON.stringify(saved));
      localStorage.setItem(sd.key, '1');
    });
  } catch(e){}
}

function readSaved(){
  try { return JSON.parse(localStorage.getItem(ROUTINE_KEY) || '{}'); } catch(e){ return {}; }
}

function saveRoutine(){
  const saved = readSaved();
  const dias = {};
  for(let d=0; d<7; d++) dias[d] = GYM[d] || null;
  saved[fase] = dias;
  try { localStorage.setItem(ROUTINE_KEY, JSON.stringify(saved)); } catch(e){}
}

// la fase la manda la semana que estás viendo, no un botón
function syncFase(){
  const f = faseDeFecha(curDayDate);
  if(f !== fase){ fase = f; openSess.clear(); }
  GYM = faseGym(f);
  renderFase();
}

// tocar una fase te lleva a su primera semana
function irAFase(f){
  const mon = getMondayOf(PLAN_START);
  mon.setDate(mon.getDate() + (FASE_INICIO[f]-1)*7);
  const dow = curDayDate.getDay();
  mon.setDate(mon.getDate() + (dow===0 ? 6 : dow-1));
  curDayDate = mon;
  syncFase();
  buildDays();
  renderDay(curDayDate);
}

// ── MODAL: editar / agregar ejercicio ──
let editCtx = null;   // {dow, si, ei}  — ei === null significa "agregar"

function fillEdit(ex){
  document.getElementById('editName').value   = ex.n || '';
  document.getElementById('editSets').value   = ex.sets || '';
  document.getElementById('editReps').value   = ex.reps || '';
  document.getElementById('editWeight').value = ex.weight || '';
  document.getElementById('editNote').value   = ex.note || '';
  document.getElementById('editTag').value    = ex.t || '';
}

function openEdit(dow, si, ei, e){
  if(e) e.stopPropagation();
  const ex = GYM[dow].sessions[si].ex[ei];
  if(!ex) return;
  editCtx = {dow, si, ei};
  // si el ejercicio viene del formato viejo ("4 × 10 reps"), se muestra en Reps
  const seed = (ex.sets||ex.reps||ex.weight) ? ex : {...ex, reps: ex.m || ''};
  fillEdit(seed);
  document.getElementById('editTitle').textContent = 'Editar ejercicio';
  document.getElementById('editDel').style.display = 'flex';
  document.getElementById('editOv').classList.add('show');
}

function addEx(dow, si, e){
  if(e) e.stopPropagation();
  editCtx = {dow, si, ei: null};
  fillEdit({t:'thor'});
  document.getElementById('editTitle').textContent = 'Agregar ejercicio';
  document.getElementById('editDel').style.display = 'none';
  document.getElementById('editOv').classList.add('show');
  setTimeout(()=>document.getElementById('editName').focus(), 80);
}

function closeEdit(){
  document.getElementById('editOv').classList.remove('show');
  editCtx = null;
}
function closeEditIfBg(e){
  if(e.target === document.getElementById('editOv')) closeEdit();
}

function saveEdit(){
  if(!editCtx) return;
  const {dow, si, ei} = editCtx;
  const name = document.getElementById('editName').value.trim();
  if(!name){ document.getElementById('editName').focus(); return; }
  const data = {
    n: name,
    sets:   document.getElementById('editSets').value.trim(),
    reps:   document.getElementById('editReps').value.trim(),
    weight: document.getElementById('editWeight').value.trim(),
    note:   document.getElementById('editNote').value.trim(),
    t:      document.getElementById('editTag').value,
    m: ''   // se descarta el formato libre viejo al guardar
  };
  const list = GYM[dow].sessions[si].ex;
  if(ei === null) list.push(data);
  else Object.assign(list[ei], data);
  saveRoutine();
  closeEdit();
  refreshGym();
}

function deleteEx(){
  if(!editCtx || editCtx.ei === null) return;
  const {dow, si, ei} = editCtx;
  const ex = GYM[dow].sessions[si].ex[ei];
  if(!confirm('¿Eliminar "'+ex.n+'" de la rutina?')) return;
  GYM[dow].sessions[si].ex.splice(ei, 1);
  saveRoutine();
  closeEdit();
  refreshGym();
}

function moveEx(dow, si, ei, dir, e){
  if(e) e.stopPropagation();
  const list = GYM[dow].sessions[si].ex;
  const to = ei + dir;
  if(to < 0 || to >= list.length) return;
  const [item] = list.splice(ei, 1);
  list.splice(to, 0, item);
  saveRoutine();
  openSess.add(si);
  refreshGym();
}

// ── BLOQUES ──
function moveSess(dow, si, dir, e){
  if(e) e.stopPropagation();
  const list = GYM[dow].sessions;
  const to = si + dir;
  if(to < 0 || to >= list.length) return;
  const [item] = list.splice(si, 1);
  list.splice(to, 0, item);
  saveRoutine();
  openSess = new Set([to]);
  refreshGym();
}

function addBlock(dow){
  if(!GYM[dow]) GYM[dow] = {label:'Entrenamiento', tipo:'', sessions:[]};
  GYM[dow].sessions.push({
    id:'blk_'+Date.now(),
    type:'Bloque '+(GYM[dow].sessions.length+1),
    name:'Nuevo bloque',
    icon:'dumbbell', ic:'ic-gym',
    ex:[]
  });
  saveRoutine();
  openSess.add(GYM[dow].sessions.length-1);
  refreshGym();
}

function deleteBlock(dow, si, e){
  if(e) e.stopPropagation();
  const sess = GYM[dow].sessions[si];
  if(!confirm('¿Eliminar el bloque "'+sess.name+'" y todos sus ejercicios?')) return;
  GYM[dow].sessions.splice(si, 1);
  if(GYM[dow].sessions.length === 0) GYM[dow] = null;
  saveRoutine();
  openSess = new Set();
  refreshGym();
}

// ── MODAL: renombrar dia o sesion ──
let nameCtx = null;   // {kind:'day'|'sess', dow, si}

// íconos disponibles para un bloque, además de cualquier emoji
const ICON_CHOICES = ['dumbbell','bolt','run','arch','posture','timer','moon','chart'];
let iconSel = null;   // nombre del ícono elegido, o null si se usa un emoji

function buildIconGrid(){
  const g = document.getElementById('iconGrid');
  g.innerHTML = ICON_CHOICES.map(n =>
    `<button type="button" class="icon-opt${n===iconSel?' sel':''}" data-ic="${n}" onclick="pickIcon('${n}')">${icon(n)}</button>`
  ).join('');
}

function pickIcon(n){
  iconSel = n;
  document.getElementById('nameEmoji').value = '';   // el ícono manda sobre el emoji
  buildIconGrid();
}

function onEmojiInput(){
  if(document.getElementById('nameEmoji').value.trim()){
    iconSel = null;
    buildIconGrid();
  }
}

function openNameModal(title, label, value, subLabel, subValue, showReset, sess){
  document.getElementById('nameTitle').textContent = title;
  document.getElementById('nameLbl').textContent = label;
  document.getElementById('nameInp').value = value || '';
  document.getElementById('nameSubLbl').textContent = subLabel;
  document.getElementById('nameSub').value = subValue || '';
  document.getElementById('nameReset').style.display = showReset ? 'block' : 'none';
  // el ícono solo aplica a bloques
  document.getElementById('nameIconWrap').style.display = sess ? '' : 'none';
  if(sess){
    document.getElementById('nameEmoji').value = sess.emoji || '';
    iconSel = sess.emoji ? null : (sess.icon || 'dumbbell');
    buildIconGrid();
  }
  document.getElementById('nameOv').classList.add('show');
  setTimeout(()=>document.getElementById('nameInp').focus(), 80);
}

function openDayName(){
  const dow = curDayDate.getDay();
  if(!GYM[dow]) return;
  nameCtx = {kind:'day', dow};
  openNameModal('Actividad del día', 'Nombre de la actividad', GYM[dow].label,
                'Descripción corta', GYM[dow].tipo, true, null);
}

function openSessName(dow, si, e){
  if(e) e.stopPropagation();
  const sess = GYM[dow].sessions[si];
  nameCtx = {kind:'sess', dow, si};
  openNameModal('Nombre del bloque', 'Nombre', sess.name, 'Subtítulo', sess.type, false, sess);
}

function closeName(){
  document.getElementById('nameOv').classList.remove('show');
  nameCtx = null;
}
function closeNameIfBg(e){
  if(e.target === document.getElementById('nameOv')) closeName();
}

function saveName(){
  if(!nameCtx) return;
  const v = document.getElementById('nameInp').value.trim();
  const sub = document.getElementById('nameSub').value.trim();
  if(!v){ document.getElementById('nameInp').focus(); return; }
  if(nameCtx.kind === 'day'){
    GYM[nameCtx.dow].label = v;
    GYM[nameCtx.dow].tipo = sub;
  } else {
    const sess = GYM[nameCtx.dow].sessions[nameCtx.si];
    sess.name = v;
    sess.type = sub;
    const emoji = document.getElementById('nameEmoji').value.trim();
    sess.emoji = emoji;                       // vacío = se usa el ícono
    if(!emoji) sess.icon = iconSel || sess.icon || 'dumbbell';
  }
  saveRoutine();
  closeName();
  refreshGym();
}

function resetDay(){
  if(!nameCtx || nameCtx.kind !== 'day') return;
  const dow = nameCtx.dow;
  if(!confirm('¿Restaurar la rutina original de este día? Se pierden los cambios que hiciste.')) return;
  GYM[dow] = FASE_DEFAULT[fase][dow] ? JSON.parse(JSON.stringify(FASE_DEFAULT[fase][dow])) : null;
  saveRoutine();
  openSess = new Set();
  closeName();
  refreshGym();
}

init();
</script>
